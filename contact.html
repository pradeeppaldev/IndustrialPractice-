<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Online Art Gallery</title>
    <link rel="stylesheet" href="contact.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo">THE CREATIVE CORNER 🎨🖌️</div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="exhibition.html">Exhibitions</a></li>
          <li><a href="artists.html">Artists</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- Contact Section -->
    <section id="contact">
      <h2>Contact Us</h2>
      <div class="contact-form">
        <form>
          <div class="form-group">
            <label for="name">Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Message:</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Your message"
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Send Message</button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>Contact us: contact@artgallery.com</p>
      <p>
        Follow us on: <a href="#">Instagram</a> | <a href="#">Facebook</a> |
        <a href="#">Twitter</a>
      </p>
      <p><a href="#">Privacy Policy</a></p>
    </footer>
  </body>
</html>
